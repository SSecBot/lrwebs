# LrWebs — üretim yayını
# Kullanım:  cp .env.example .env  →  değerleri doldurun  →  docker compose up -d --build
services:
  lrwebs:
    build: .
    image: lrwebs:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Caddy ters vekilinin arkasında çalışır; istemci IP'si X-Forwarded-For'dan okunur.
      TRUST_PROXY: "1"
    volumes:
      - lrwebs-data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      lrwebs:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN .env dosyasında tanımlanmalı}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  lrwebs-data:
  caddy-data:
  caddy-config:
